# CodeQL analysis of a go-rotini module, built with the build command given.
name: Go CodeQL

on:
  workflow_call:
    inputs:
      build:
        description: The bash script that builds the code CodeQL analyzes.
        type: string
        default: go build ./...
      go-version:
        description: The Go release for setup-go, such as 1.27.x. Empty reads go-version-file.
        type: string
        default: ""
      go-version-file:
        description: The file setup-go reads the Go release from when go-version is empty.
        type: string
        default: go.mod
      cache-dependency-path:
        description: The files whose contents key the Go module and build cache.
        type: string
        default: go.sum

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          check-latest: ${{ inputs.go-version != '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual

      - name: Build
        env:
          BUILD: ${{ inputs.build }}
        run: eval "$BUILD"

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
