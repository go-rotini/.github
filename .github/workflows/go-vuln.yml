# govulncheck over a go-rotini module and the tools in its tools.mod (make vuln, make
# vuln-tools). A new advisory for the standard library or a dependency can land between pushes;
# a scheduled run finds it without waiting for one.
name: Go vulnerability scan

on:
  workflow_call:
    inputs:
      go-version:
        description: The Go release for setup-go, such as 1.27.x. Empty reads go-version-file.
        type: string
        default: ""
      go-version-file:
        description: The file setup-go reads the Go release from when go-version is empty.
        type: string
        default: go.mod

permissions:
  contents: read

jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          check-latest: ${{ inputs.go-version != '' }}
          cache-dependency-path: |
            go.sum
            tools.sum

      - name: Scan the module and its tools
        run: |
          make vuln
          make vuln-tools
