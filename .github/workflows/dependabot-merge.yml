# Merges a Dependabot pull request once CI passes on it, when it is one of the grouped updates
# the repository's dependabot.yml marks safe: groups that only take minor and patch versions.
# A major version is never grouped, so its pull request waits for a person.
#
# The caller runs it when CI completes, and passes its secrets:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#   jobs:
#     merge:
#       uses: go-rotini/.github/.github/workflows/dependabot-merge.yml@main
#       secrets: inherit
#
# The merge is made as rotinibot, a GitHub App the main branch's ruleset lets through:
# its client ID is the ROTINIBOT_CLIENT_ID organization variable and its private key the
# ROTINIBOT_PRIVATE_KEY organization secret. A merge made that way starts CI on main (and
# so the release) as a person's would.
name: Dependabot merge

on:
  workflow_call:
    inputs:
      groups:
        description: The dependabot.yml groups whose pull requests may merge, space separated.
        type: string
        default: go-rotini go-deps actions docker
    secrets:
      ROTINIBOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      MERGE_GROUPS: ${{ inputs.groups }}
    steps:
      - name: Find the pull request and check it is a safe group update
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .user.login == "dependabot[bot]" and .head.sha == env.SHA)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "no open Dependabot pull request has $SHA as its head; nothing to merge"
            exit 0
          fi
          title=$(gh pr view "$pr" --json title --jq .title)
          group=$(printf '%s' "$title" | sed -nE 's/.* the ([A-Za-z0-9_-]+) group.*/\1/p')
          if [ -z "$group" ] || ! printf ' %s ' "$MERGE_GROUPS" | grep -q " $group "; then
            echo "::notice::#$pr is not a grouped minor or patch update ($title); it waits for review"
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Check rotinibot is set up
        id: bot
        if: steps.pr.outputs.number != ''
        env:
          CLIENT_ID: ${{ vars.ROTINIBOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.ROTINIBOT_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::warning::ROTINIBOT_CLIENT_ID or ROTINIBOT_PRIVATE_KEY is not set, so #${{ steps.pr.outputs.number }} can't be merged automatically"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: steps.bot.outputs.ready == 'true'
        with:
          client-id: ${{ vars.ROTINIBOT_CLIENT_ID }}
          private-key: ${{ secrets.ROTINIBOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # An actions update changes files under .github/workflows.
          permission-workflows: write

      - name: Merge
        if: steps.bot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.pr.outputs.title }}
        run: |
          gh pr merge "$PR" --squash --admin --match-head-commit "$SHA"
          echo "merged #$PR ($TITLE)"
