# Merges a pull request once CI passes on it, in two cases:
#
# - It is one of the grouped Dependabot updates the repository's dependabot.yml marks safe:
#   groups that only take minor and patch versions. A major version is never grouped, so its pull
#   request waits for a person.
# - A go-rotini organization owner pressed Enable auto-merge on it. Anyone else's press is
#   ignored, and the pull request waits for review as usual.
#
# The caller runs it when CI completes and when auto-merge is enabled, and passes its secrets:
#
#   on:
#     workflow_run:
#       workflows: [CI]
#       types: [completed]
#     pull_request_target:
#       types: [auto_merge_enabled]
#   jobs:
#     merge:
#       uses: go-rotini/.github/.github/workflows/auto-merge.yml@main
#       secrets: inherit
#
# Nothing here checks out or runs the pull request's code. The merge is a squash pinned to the
# commit CI passed on, made as rotinibot, a GitHub App the main branch's ruleset lets through:
# its client ID is the ROTINIBOT_CLIENT_ID organization variable and its private key the
# ROTINIBOT_PRIVATE_KEY organization secret. A merge made that way starts CI on main (and so the
# release) as a person's would.
name: Auto-merge

on:
  workflow_call:
    inputs:
      groups:
        description: The dependabot.yml groups whose pull requests may merge, space separated.
        type: string
        default: go-rotini go-deps actions docker
      ci-workflow:
        description: The file of the CI workflow that must pass, in the caller's .github/workflows.
        type: string
        default: ci.yml
    secrets:
      ROTINIBOT_PRIVATE_KEY:
        required: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request') ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      ORG: ${{ github.repository_owner }}
      MERGE_GROUPS: ${{ inputs.groups }}
    steps:
      - name: Find the pull request and the commit CI passed on
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
        run: |
          fields=number,title,headRefOid,author,autoMergeRequest
          if [ "$EVENT" = workflow_run ]; then
            sha=$RUN_SHA
            pr=$(gh pr list --state open --limit 100 --json "$fields" --jq "[.[] | select(.headRefOid == \"$sha\")][0] // empty")
          else
            # Auto-merge was enabled; merge now only if CI already passed on the head commit.
            # Otherwise the workflow_run event decides when CI finishes.
            sha=$PR_SHA
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/$CI_WORKFLOW/runs?head_sha=$sha&event=pull_request&per_page=1" --jq '.workflow_runs[0].conclusion // empty')
            if [ "$conclusion" != success ]; then
              echo "CI hasn't passed on $sha yet; the merge waits for it"
              exit 0
            fi
            pr=$(gh pr view "$PR_NUMBER" --json "$fields,state" --jq 'select(.state == "OPEN")')
          fi
          if [ -z "$pr" ]; then
            echo "no open pull request has $sha as its head; nothing to merge"
            exit 0
          fi
          number=$(printf '%s' "$pr" | jq -r .number)
          title=$(printf '%s' "$pr" | jq -r .title)
          author=$(printf '%s' "$pr" | jq -r .author.login)
          enabled_by=$(printf '%s' "$pr" | jq -r '.autoMergeRequest.enabledBy.login // empty')
          if [ "$author" = app/dependabot ] || [ "$author" = 'dependabot[bot]' ]; then
            group=$(printf '%s' "$title" | sed -nE 's/.* the ([A-Za-z0-9_-]+) group.*/\1/p')
            if [ -n "$group" ] && printf ' %s ' "$MERGE_GROUPS" | grep -q " $group "; then
              reason="Dependabot's $group group"
            fi
          fi
          if [ -z "${reason:-}" ] && [ -z "$enabled_by" ]; then
            echo "::notice::#$number is not a grouped minor or patch update and auto-merge is off; it waits for review"
            exit 0
          fi
          {
            echo "number=$number"
            echo "title=$title"
            echo "sha=$sha"
            echo "reason=${reason:-}"
            echo "enabled-by=$enabled_by"
          } >> "$GITHUB_OUTPUT"

      - name: Check rotinibot is set up
        id: bot
        if: steps.pr.outputs.number != ''
        env:
          CLIENT_ID: ${{ vars.ROTINIBOT_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.ROTINIBOT_PRIVATE_KEY }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::warning::ROTINIBOT_CLIENT_ID or ROTINIBOT_PRIVATE_KEY is not set, so #$PR can't be merged automatically"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: steps.bot.outputs.ready == 'true'
        with:
          client-id: ${{ vars.ROTINIBOT_CLIENT_ID }}
          private-key: ${{ secrets.ROTINIBOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          # An actions update changes files under .github/workflows.
          permission-workflows: write
          # To check whoever enabled auto-merge is an organization owner.
          permission-members: read

      - name: Check who enabled auto-merge
        id: trust
        if: steps.bot.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          REASON: ${{ steps.pr.outputs.reason }}
          ENABLED_BY: ${{ steps.pr.outputs.enabled-by }}
        run: |
          if [ -n "$REASON" ]; then
            echo "reason=$REASON" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          membership=$(gh api "orgs/$ORG/memberships/$ENABLED_BY" --jq '"\(.state) \(.role)"' 2>/dev/null || true)
          if [ "$membership" != "active admin" ]; then
            echo "::notice::#$PR had auto-merge enabled by $ENABLED_BY, who is not a $ORG owner; it waits for review"
            exit 0
          fi
          echo "reason=auto-merge enabled by $ENABLED_BY" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.trust.outputs.reason != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          TITLE: ${{ steps.pr.outputs.title }}
          SHA: ${{ steps.pr.outputs.sha }}
          REASON: ${{ steps.trust.outputs.reason }}
        run: |
          gh pr merge "$PR" --squash --admin --match-head-commit "$SHA"
          echo "merged #$PR ($TITLE): $REASON"
