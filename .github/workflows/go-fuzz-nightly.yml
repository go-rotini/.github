# Fuzz targets for ten minutes each. Pushes run every target briefly (make test-fuzz); this
# longer run reaches inputs a short one doesn't. A failing input is kept as an artifact: put it
# under the package's testdata/fuzz/<target>/ to reproduce it with go test.
#
# With no targets given, every fuzz target in the packages given runs, so a new or renamed
# target is picked up. targets names them instead, as [{"package": "./x", "name": "FuzzY"}].
name: Go nightly fuzz

on:
  workflow_call:
    inputs:
      packages:
        description: The packages whose fuzz targets run, space separated.
        type: string
        default: .
      targets:
        description: Specific targets, as a YAML (or JSON) list of {package, name}; overrides packages.
        type: string
        default: ""
      fuzztime:
        description: How long each target runs.
        type: string
        default: 10m
      go-version:
        description: The Go release for setup-go, such as 1.27.x. Empty reads go-version-file.
        type: string
        default: ""
      go-version-file:
        description: The file setup-go reads the Go release from when go-version is empty.
        type: string
        default: go.mod

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          check-latest: ${{ inputs.go-version != '' }}

      # go test -fuzz exits 0 when no target matches, so each named target is checked to exist.
      - name: List the fuzz targets
        id: list
        env:
          PACKAGES: ${{ inputs.packages }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [ -n "$TARGETS" ]; then
            targets=$(printf '%s' "$TARGETS" | yq -o=json -I=0 '.')
            for row in $(printf '%s' "$targets" | jq -r '.[] | "\(.package)=\(.name)"'); do
              pkg=${row%%=*} name=${row#*=}
              if ! go test -list "^${name}\$" "$pkg" | grep -qx "$name"; then
                echo "::error::$name is not a fuzz target in $pkg"
                exit 1
              fi
            done
          else
            targets=$(for pkg in $PACKAGES; do
              go test -list '^Fuzz' "$pkg" | grep '^Fuzz' | jq -R --arg p "$pkg" '{package: $p, name: .}'
            done | jq -cs .)
          fi
          if [ "$targets" = "[]" ]; then
            echo "::error::no fuzz targets found"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: ${{ matrix.target.name }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE: ${{ matrix.target.package }}
      TARGET: ${{ matrix.target.name }}
      FUZZTIME: ${{ inputs.fuzztime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && inputs.go-version-file || '' }}
          check-latest: ${{ inputs.go-version != '' }}

      # go test can race with its own deadline and fail with a bare "context deadline exceeded"
      # and no failing input; as in make test-fuzz, that outcome counts as a pass.
      - name: Fuzz
        run: |
          set +e
          go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="$FUZZTIME" "$PACKAGE" 2>&1 | tee fuzz.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q '^    context deadline exceeded$' fuzz.log && ! grep -q 'Failing input written' fuzz.log; then
              echo "fuzz time elapsed; deadline race in go test, no failing input"
              exit 0
            fi
            exit "$status"
          fi

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target.name }}
          path: ${{ matrix.target.package }}/testdata/fuzz/${{ matrix.target.name }}/
          if-no-files-found: ignore
